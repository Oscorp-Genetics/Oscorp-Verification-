<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SPIDER SYSTEM</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03050a;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{display:grid;place-items:center}
canvas{position:fixed;inset:0;width:100%;height:100%;opacity:.55}
.hud{position:relative;width:min(1100px,94vw);height:min(700px,90vh);border:1px solid rgba(0,190,255,.45);background:linear-gradient(135deg,rgba(5,10,20,.88),rgba(20,2,8,.78));box-shadow:0 0 45px rgba(0,150,255,.12),inset 0 0 60px rgba(255,0,40,.05);overflow:hidden}
.hud:before,.hud:after{content:"";position:absolute;inset:14px;border:1px solid rgba(255,40,60,.2);pointer-events:none}
.hud:after{inset:25px;border-color:rgba(0,180,255,.12)}
.top{height:62px;border-bottom:1px solid rgba(0,180,255,.25);display:flex;align-items:center;justify-content:space-between;padding:0 28px;letter-spacing:3px;font-size:12px}
.logo{color:#ff3045;font-weight:800;font-size:18px}
.status{color:#55dfff}
.main{height:calc(100% - 62px);display:grid;grid-template-columns:1fr 280px;gap:20px;padding:30px}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative}
.web{position:absolute;width:min(440px,65vw);aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 39px,rgba(0,190,255,.13) 40px 41px),repeating-conic-gradient(from 0deg,transparent 0 14deg,rgba(255,30,55,.12) 15deg 16deg);mask-image:radial-gradient(circle,#000 0 72%,transparent 73%);animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.title{z-index:2;text-align:center}
.title small{display:block;color:#55dfff;letter-spacing:7px;font-size:11px;margin-bottom:18px}
#typed{font-size:clamp(34px,6vw,76px);font-weight:900;letter-spacing:5px;color:#fff;text-shadow:0 0 18px rgba(255,30,50,.65);min-height:1.2em}
.cursor{display:inline-block;width:5px;height:.9em;background:#ff3045;vertical-align:-5px;animation:blink .7s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.subtitle{margin-top:18px;color:#9bb2c0;letter-spacing:3px;font-size:10px}
.panel{border-left:1px solid rgba(0,190,255,.25);padding:10px 0 10px 25px;display:flex;flex-direction:column;gap:14px}
.card{border:1px solid rgba(0,190,255,.22);background:rgba(0,20,35,.3);padding:15px}
.card h3{margin:0 0 12px;color:#55dfff;font-size:10px;letter-spacing:3px}
.row{display:flex;justify-content:space-between;font-size:11px;color:#9fb2bd;margin:9px 0}.row b{color:#fff}
.bar{height:4px;background:#15212a;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;width:87%;background:#ff3045;box-shadow:0 0 8px #ff3045}
button{margin-top:auto;border:1px solid rgba(255,40,60,.55);background:rgba(255,20,40,.08);color:#fff;padding:13px;letter-spacing:3px;font-size:10px;cursor:pointer}
button:hover{background:rgba(255,20,40,.2)}
.corner{position:absolute;width:34px;height:34px;border-color:#ff3045;border-style:solid;opacity:.8}
.c1{top:8px;left:8px;border-width:2px 0 0 2px}.c2{top:8px;right:8px;border-width:2px 2px 0 0}.c3{bottom:8px;left:8px;border-width:0 0 2px 2px}.c4{bottom:8px;right:8px;border-width:0 2px 2px 0}
@media(max-width:750px){.hud{height:94vh}.main{grid-template-columns:1fr;padding:20px}.panel{display:none}.top{padding:0 18px}.center{height:100%}}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="hud">
  <div class="corner c1"></div><div class="corner c2"></div><div class="corner c3"></div><div class="corner c4"></div>
  <header class="top"><div class="logo">SPIDER SYSTEM // 01</div><div class="status">● SYSTEM ONLINE</div></header>
  <main class="main">
    <section class="center">
      <div class="web"></div>
      <div class="title">
        <small>IDENTITY CONFIRMED</small>
        <div id="typed"></div>
        <div class="subtitle">NEURAL LINK · ACTIVE &nbsp;|&nbsp; WEB PROTOCOL · READY</div>
      </div>
    </section>
    <aside class="panel">
      <div class="card"><h3>VITALS</h3><div class="row"><span>HEART RATE</span><b id="bpm">78 BPM</b></div><div class="bar"><i></i></div><div class="row"><span>REACTION</span><b>98%</b></div><div class="bar"><i style="width:98%"></i></div></div>
      <div class="card"><h3>WEB STATUS</h3><div class="row"><span>CARTRIDGE</span><b>FULL</b></div><div class="row"><span>PRESSURE</span><b>OPTIMAL</b></div><div class="row"><span>MODE</span><b>STEALTH</b></div></div>
      <div class="card"><h3>ENVIRONMENT</h3><div class="row"><span>THREAT LEVEL</span><b id="threat">LOW</b></div><div class="row"><span>NETWORK</span><b>SECURE</b></div></div>
      <button id="scan">RUN SYSTEM SCAN</button>
    </aside>
  </main>
</div>
<script>
const text="I AM SPIDER-MAN";
const out=document.getElementById("typed");
let i=0;
function type(){if(i<=text.length){out.innerHTML=text.slice(0,i)+'<span class="cursor"></span>';i++;setTimeout(type,85)}}
type();

const canvas=document.getElementById("stars"),ctx=canvas.getContext("2d");
function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;ctx.scale(devicePixelRatio,devicePixelRatio)}
resize();addEventListener("resize",resize);
let dots=Array.from({length:110},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,s:Math.random()*1.7+.2,v:Math.random()*.35+.05}));
function draw(){ctx.clearRect(0,0,innerWidth,innerHeight);ctx.fillStyle="#69dfff";for(const d of dots){d.y-=d.v;if(d.y<0)d.y=innerHeight;ctx.globalAlpha=.15+d.s/3;ctx.fillRect(d.x,d.y,d.s,d.s)}requestAnimationFrame(draw)}draw();

setInterval(()=>document.getElementById("bpm").textContent=(74+Math.floor(Math.random()*13))+" BPM",1200);
document.getElementById("scan").onclick=()=>{
 const t=document.getElementById("threat"); t.textContent="SCANNING";
 setTimeout(()=>t.textContent=["LOW","CLEAR","LOW","CLEAR"][Math.floor(Math.random()*4)],900);
};
</script>
</body>
</html>
